[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gs-provisioner"
version = "0.2.0"
description = "Provisioner: detecção de ambiente, instalação automatizada e verificação de saúde do pipeline de Gaussian Splatting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["provisioner"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
