[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gs-api"
version = "0.1.0"
description = "API local FastAPI — orquestra o Provisioner e (nas próximas fases) os jobs do pipeline de Gaussian Splatting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "gs-provisioner",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
