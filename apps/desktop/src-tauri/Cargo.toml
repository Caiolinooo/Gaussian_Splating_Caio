[package]
name = "gsplat-studio"
version = "0.1.0"
description = "Shell desktop (Tauri v2) da plataforma de Gaussian Splatting"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
